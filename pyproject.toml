[project]
name = "eink-deck"
version = "2.4.50"
description = "Outline Markdown -> single-file horizontal-flip HTML PPT rendering engine"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.0",
    "fontTools>=4.40",
    "brotli>=1.0",
    "certifi>=2024.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["engine"]
